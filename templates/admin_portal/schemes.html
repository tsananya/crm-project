{% extends 'admin_portal/layout.html' %}
{% block page %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Loan Schemes</h3>
  <a href="{% url 'scheme_add' %}" class="btn btn-primary">+ Add Scheme</a>
</div>
<div class="table-responsive">
  <table class="table table-striped bg-white">
    <thead><tr><th>Bank</th><th>Scheme</th><th>Interest</th><th>Min</th><th>Max</th><th></th></tr></thead>
    <tbody>
      {% for s in schemes %}
      <tr>
        <td>{{ s.bank.name }}</td><td>{{ s.name }}</td><td>{{ s.interest_rate }}%</td>
        <td>&#8377;{{ s.min_amount }}</td><td>&#8377;{{ s.max_amount }}</td>
        <td class="text-end"><a href="{% url 'scheme_edit' s.pk %}" class="btn btn-sm btn-outline-primary">Edit</a></td>
      </tr>
      {% empty %}<tr><td colspan="6" class="text-center">No schemes yet.</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
