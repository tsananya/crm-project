{% extends 'admin_portal/layout.html' %}
{% block page %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Banks</h3>
  <a href="{% url 'bank_add' %}" class="btn btn-primary">+ Add Bank</a>
</div>
<div class="table-responsive">
  <table class="table table-striped bg-white">
    <thead><tr><th>Name</th><th>Contact</th><th>Phone</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {% for b in banks %}
      <tr>
        <td>{{ b.name }}</td><td>{{ b.contact_person }}</td><td>{{ b.phone }}</td>
        <td>{% if b.is_active %}<span class="badge bg-success">Active</span>{% else %}<span class="badge bg-secondary">Inactive</span>{% endif %}</td>
        <td class="text-end"><a href="{% url 'bank_edit' b.pk %}" class="btn btn-sm btn-outline-primary">Edit</a></td>
      </tr>
      {% empty %}<tr><td colspan="5" class="text-center">No banks yet.</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
