{% extends 'admin_portal/layout.html' %}
{% block page %}
<h3>{{ title }}</h3>
<div class="card shadow-sm" style="max-width:520px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for err in field.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn-primary">Save</button>
      <a href="{% url back %}" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
